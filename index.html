    ctx.restore();
  }

  // ── Background drifting petals (ambient) ──
  const PCOLS=['#ffb7c5','#ff8fab','#ffc0cb','#ff85a1','#f9a8c9','#ff69b4'];
  const bgPetals=Array.from({length:28},()=>({
    x:Math.random()*W, y:Math.random()*H,
    vy:0.4+Math.random()*0.8, vx:(Math.random()-0.5)*0.4,
    size:isMob?8+Math.random()*10:10+Math.random()*14,
    spin:Math.random()*Math.PI*2, spinV:(Math.random()-0.5)*0.018,
    alpha:0.12+Math.random()*0.22,
    color:PCOLS[Math.floor(Math.random()*PCOLS.length)]
  }));

  // ── Text layout ──
  const LINE1='Happy Birthday,', LINE2='Kilul! 🌸';
  const fs1=isMob?Math.min(W*0.072,36):Math.min(W*0.046,52);
  const fs2=isMob?Math.min(W*0.10,50):Math.min(W*0.065,72);
  const lineGap=isMob?14:20;
  const totalH=fs1+lineGap+fs2;
  const cy1=H/2-totalH/2+fs1;
  const cy2=cy1+fs1+lineGap+fs2;

  // ── Sample letter positions ──
  ctx.font=`italic 700 ${fs1}px 'Cormorant Garamond',serif`;
  const w1=ctx.measureText(LINE1).width;
  ctx.font=`italic 900 ${fs2}px 'Cormorant Garamond',serif`;
  const w2=ctx.measureText(LINE2).width;

  // Measure each character position
  function measureChars(line,font,cy,totalW){
    ctx.font=font;
    const chars=[];
    let ox=W/2-totalW/2;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      const cw=ctx.measureText(ch).width;
      if(ch!==' ') chars.push({ch,tx:ox+cw/2,ty:cy});
      ox+=cw;
    }
    return chars;
  }

  const chars1=measureChars(LINE1,`italic 700 ${fs1}px 'Cormorant Garamond',serif`,cy1,w1);
  const chars2=measureChars(LINE2,`italic 900 ${fs2}px 'Cormorant Garamond',serif`,cy2,w2);
  const allChars=[...chars1,...chars2];

  // ── Swirl petals: one per character, spirals in from random edge ──
  const swirl=allChars.map((c,i)=>({
    ...c,
    // start from a random point outside the canvas on a circular arc
    startAngle: Math.random()*Math.PI*2,
    startR: Math.max(W,H)*0.55 + Math.random()*100,
    spin: Math.random()*Math.PI*2,
    spinV:(Math.random()-0.5)*0.05,
    size: (c.ty===cy1 ? fs1*0.28 : fs2*0.34),
    color: PCOLS[i%PCOLS.length],
    delay: i*0.09 + Math.random()*0.08,  // staggered arrival
    arrived: false,
    dissolving: false,
    dissolveT: 0,
    alpha: 1,
    // flight path noise
    noiseOff: Math.random()*100,
  }));

  // ── Text alpha for after all petals land ──
  let textAlpha=0;
  // ── Dissolve state ──
  let phase='swirl'; // swirl → hold → dissolve → done
  let holdT=0, globalT=0;

  // Per-petal dissolve: each becomes a free-drifting petal
  const freePetals=[];

  function tick(){
    ctx.clearRect(0,0,W,H);
    // Deep dark pink-black background
    ctx.fillStyle='#0d0008';
    ctx.fillRect(0,0,W,H);
    globalT+=0.016;

    // Ambient background petals
    bgPetals.forEach(p=>{
      p.x+=p.vx+Math.sin(p.spin*0.3)*0.3; p.y+=p.vy; p.spin+=p.spinV;
      if(p.y>H+20){ p.y=-20; p.x=Math.random()*W; }
      drawPetal(p.x,p.y,p.size,p.spin,p.alpha,p.color);
    });

    if(phase==='swirl'||phase==='hold'){
      let allArrived=true;
      swirl.forEach(p=>{
        const elapsed=globalT-p.delay;
        if(elapsed<0){ allArrived=false; return; }

        if(!p.arrived){
          allArrived=false;
          // Spiral easing toward target
          const prog=Math.min(elapsed/1.2,1);
          const ease=1-Math.pow(1-prog,3);
          const sx=W/2+Math.cos(p.startAngle)*p.startR;
          const sy=H/2+Math.sin(p.startAngle)*p.startR;
          // add a gentle arc via a mid-control spiral
          const spiralAngle=p.startAngle - prog*Math.PI*1.4;
          const spiralR=p.startR*(1-ease);
          const curX=p.tx + Math.cos(spiralAngle)*spiralR*(1-ease)*2 + (sx-p.tx)*(1-ease);
          const curY=p.ty + Math.sin(spiralAngle)*spiralR*(1-ease)*2 + (sy-p.ty)*(1-ease);
          p.spin+=p.spinV;
          drawPetal(curX,curY,p.size,p.spin,Math.min(elapsed*2,1),p.color);
          if(prog>=1){ p.arrived=true; p.x=p.tx; p.y=p.ty; }
        } else {

      });

      // Draw text fading in over landed petals
      if(phase==='hold'){
        textAlpha=Math.min(textAlpha+0.025,1);
        ctx.save();
        ctx.globalAlpha=textAlpha;
        ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        // LINE 1
        ctx.font=`italic 700 ${fs1}px 'Cormorant Garamond',serif`;
        const g1=ctx.createLinearGradient(W/2-w1/2,0,W/2+w1/2,0);
        g1.addColorStop(0,'#ff80ab'); g1.addColorStop(0.5,'#ffd6e8'); g1.addColorStop(1,'#ff80ab');
        ctx.fillStyle=g1; ctx.shadowColor='#ff4081'; ctx.shadowBlur=18;
        ctx.fillText(LINE1,W/2,cy1);
        // LINE 2
        ctx.font=`italic 900 ${fs2}px 'Cormorant Garamond',serif`;
        const g2=ctx.createLinearGradient(W/2-w2/2,0,W/2+w2/2,0);
        g2.addColorStop(0,'#ff4081'); g2.addColorStop(0.4,'#ffd6e8'); g2.addColorStop(0.7,'#ffb3c8'); g2.addColorStop(1,'#ff4081');
        ctx.fillStyle=g2; ctx.shadowColor='#ff80ab'; ctx.shadowBlur=28;
        ctx.fillText(LINE2,W/2,cy2);
        // subtle second pass for glow depth
        ctx.globalAlpha=textAlpha*0.35; ctx.shadowBlur=50;
        ctx.fillText(LINE2,W/2,cy2);
        ctx.restore();

        if(allArrived && holdT===0) holdT=globalT;
        // After 3s hold → dissolve
        if(holdT>0 && globalT-holdT>3.0){
          phase='dissolve';
          // spawn free petals from each swirl petal
          swirl.forEach(p=>{
            freePetals.push({
              x:p.tx, y:p.ty, size:p.size, spin:p.spin,
              color:p.color, alpha:1,
              vx:(Math.random()-0.5)*2.5,
              vy:-(0.5+Math.random()*2.0),
              spinV:(Math.random()-0.5)*0.07,
              decay:0.008+Math.random()*0.008
            });
          });
        }
      }

      if(allArrived && phase==='swirl'){ phase='hold'; }
    }

    if(phase==='dissolve'){
      // Fade out text
      textAlpha=Math.max(textAlpha-0.018,0);
      if(textAlpha>0){
        ctx.save(); ctx.globalAlpha=textAlpha; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        ctx.font=`italic 700 ${fs1}px 'Cormorant Garamond',serif`;
        const g1=ctx.createLinearGradient(W/2-w1/2,0,W/2+w1/2,0);
        g1.addColorStop(0,'#ff80ab'); g1.addColorStop(0.5,'#ffd6e8'); g1.addColorStop(1,'#ff80ab');
        ctx.fillStyle=g1; ctx.shadowColor='#ff4081'; ctx.shadowBlur=18;
        ctx.fillText(LINE1,W/2,cy1);
        ctx.font=`italic 900 ${fs2}px 'Cormorant Garamond',serif`;
        const g2=ctx.createLinearGradient(W/2-w2/2,0,W/2+w2/2,0);
        g2.addColorStop(0,'#ff4081'); g2.addColorStop(0.5,'#ffd6e8'); g2.addColorStop(1,'#ff4081');
        ctx.fillStyle=g2; ctx.shadowColor='#ff80ab'; ctx.shadowBlur=28;
        ctx.fillText(LINE2,W/2,cy2);
        ctx.restore();
      }

      // Animate free petals
      for(let i=freePetals.length-1;i>=0;i--){
        const p=freePetals[i];
        p.x+=p.vx+Math.sin(p.spin*0.4)*0.5;

        wrap.style.opacity='0';

      }
    }

    requestAnimationFrame(tick);
  }

  // Fade in then start
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ wrap.style.opacity='1'; }));
  setTimeout(()=>{ requestAnimationFrame(tick); }, 400);
}

    const tileSize=isMob?Math.min(W*0.18,72):Math.min(W*0.12,96);
    const margin=tileSize/2+10;
    falling.push({
      ch, color,
      x:W/2,
      y:-tileSize,
      vy:isMob?(8.0+Math.random()*2.0):(7.0+Math.random()*1.5),
      vx:0,
      spin:( Math.random()-0.5)*0.08,
      angle:0,
      tileSize,
      alpha:1,
      caught:false,
      idx:nextIdx,
      wobble:Math.random()*Math.PI*2,
    });
    nextIdx++;
  }

  // ── Draw a letter tile ──
  function drawTile(l){
    ctx.save();
    ctx.globalAlpha=l.alpha;
    ctx.translate(l.x,l.y); ctx.rotate(l.angle);
    const s=l.tileSize;
    // Glow halo
    const halo=ctx.createRadialGradient(0,0,s*0.1,0,0,s*0.75);
    halo.addColorStop(0,l.color+'55'); halo.addColorStop(1,'transparent');
    ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,s*0.75,0,Math.PI*2); ctx.fill();
    // Tile bg
    const r=s*0.22;
    ctx.beginPath();
    ctx.roundRect(-s/2,-s/2,s,s,r);
    const bg=ctx.createRadialGradient(-s*0.15,-s*0.15,0,0,0,s*0.7);
    bg.addColorStop(0,'rgba(255,240,180,0.18)'); bg.addColorStop(1,'rgba(12,8,0,0.72)');
    ctx.fillStyle=bg; ctx.fill();
    // Border
    ctx.strokeStyle=l.color; ctx.lineWidth=2.2;
    ctx.shadowColor=l.color; ctx.shadowBlur=14;
    ctx.stroke();
    // Letter
    ctx.font=`italic 900 ${Math.round(s*0.62)}px 'Cormorant Garamond',serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=l.color; ctx.shadowColor=l.color; ctx.shadowBlur=18;
    ctx.fillText(l.ch,0,2);
    // Shine
    ctx.globalAlpha=l.alpha*0.18;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-s*0.12,-s*0.22,s*0.18,s*0.10,-0.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ── Catch burst ──
  function addBurst(x,y,color){
    for(let i=0;i<18;i++){
      const a=(i/18)*Math.PI*2+(Math.random()-0.5)*0.4;
      const spd=2+Math.random()*5;
      sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1.5,
        r:2+Math.random()*4, alpha:1, color,
        decay:0.022+Math.random()*0.018});
    }
    // A few petal-like bits too
    for(let i=0;i<6;i++){
      const a=Math.random()*Math.PI*2, spd=1.5+Math.random()*3;
      sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,
        r:4+Math.random()*5, alpha:0.9,
        color:PCOLS[Math.floor(Math.random()*PCOLS.length)],
        decay:0.016+Math.random()*0.012});
    }
  }

  // ── Main loop ──
  let rafId;
  let active=true;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ wrap.style.opacity='1'; }));

  // First letter drops immediately
  setTimeout(()=>spawnLetter(), 600);

  function loop(){
    if(!active) return;
    globalT+=0.016;
    spawnTimer+=0.016;

    ctx.clearRect(0,0,W,H);
    // BG gradient
    const bg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.6,W*0.9);
    bg.addColorStop(0,'#130008'); bg.addColorStop(1,'#050002');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    // Spawn next letter after gap
    if(!done && nextIdx<WORD.length && spawnTimer>SPAWN_GAP && falling.every(f=>f.caught||f.y>H)){
      spawnTimer=0;
      spawnLetter();
    }

    // Falling letters
    for(let i=falling.length-1;i>=0;i--){
      const l=falling[i];
      if(l.caught){
        // Float up and fade on catch
        l.y-=3; l.alpha-=0.045;
        if(l.alpha<=0){ falling.splice(i,1); continue; }
        drawTile(l);
        continue;
      }
      l.wobble+=0.04;
      l.x=W/2;
      l.y+=l.vy; l.angle+=l.spin;

      // Missed — hit bottom
      if(l.y>H+l.tileSize){
        // Flash missed and re-queue this letter
        missed.push({ch:l.ch,color:l.color,x:l.x,y:H-40,alpha:1.2});
        nextIdx=l.idx; // re-drop same letter
        spawnTimer=0;
        falling.splice(i,1);
        // Small shake on spell display
        spellEl.style.transform='translateX(-50%) scale(1.12)';
        setTimeout(()=>{ spellEl.style.transform='translateX(-50%) scale(1)'; },200);
        continue;
      }

      // Danger tint near bottom
      if(l.y>H*0.72){
        const danger=Math.min((l.y-H*0.72)/(H*0.18),1);
        const pulseAlpha=0.10+danger*0.25*Math.abs(Math.sin(globalT*8));
        ctx.save(); ctx.globalAlpha=pulseAlpha;
        ctx.fillStyle='#ff0040';
        ctx.fillRect(0,0,W,H);
        ctx.restore();
      }

      drawTile(l);
    }

    // Sparks
    for(let i=sparks.length-1;i>=0;i--){
      const s=sparks[i];
      s.x+=s.vx; s.y+=s.vy; s.vy+=0.12; s.vx*=0.97;
      s.alpha-=s.decay;
      if(s.alpha<=0){ sparks.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=s.alpha; ctx.fillStyle=s.color;
      ctx.shadowColor=s.color; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    // Missed flash
    for(let i=missed.length-1;i>=0;i--){
      const m=missed[i];
      m.alpha-=0.03; m.y-=0.5;
      if(m.alpha<=0){ missed.splice(i,1); continue; }
      ctx.save(); ctx.globalAlpha=Math.min(m.alpha,1);
      ctx.font=`italic 900 ${isMob?32:42}px 'Cormorant Garamond',serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='rgba(255,60,60,0.9)'; ctx.shadowColor='#ff0040'; ctx.shadowBlur=14;
      ctx.fillText('✗ '+m.ch,m.x,m.y);
      ctx.restore();
    }

    rafId=requestAnimationFrame(loop);
  }
  loop();

  // ── Tap handler ──
  function handleTap(e){
    if(done) return;
    const pts=e.changedTouches?Array.from(e.changedTouches):[{clientX:e.clientX,clientY:e.clientY}];
    pts.forEach(touch=>{
      const tx=touch.clientX, ty=touch.clientY;
      // Must catch in order — only the first un-caught letter is valid
      const target=falling.find(l=>!l.caught && l.idx===caught.length);
      if(!target) return;
      const dx=tx-target.x, dy=ty-target.y;
      const hitR=target.tileSize*(isMob?1.1:0.9);
      if(Math.sqrt(dx*dx+dy*dy)<hitR){
        target.caught=true;
        caught.push(target.ch);
        addBurst(target.x,target.y,target.color);
        updateSpell();
        // Pulse spell display
        spellEl.style.textShadow=`0 0 40px rgba(255,215,0,1)`;
        setTimeout(()=>{ spellEl.style.textShadow=`0 0 20px rgba(255,215,0,0.7)`; },300);

        if(caught.length>=WORD.length){
          done=true;
          instrEl.textContent='✨ You spelled her name! ✨';
          instrEl.style.color='rgba(255,215,0,0.9)';
          spellEl.style.color='#ffd700';
          spellEl.style.textShadow='0 0 40px rgba(255,215,0,0.9)';
          setTimeout(()=>{
            active=false;
            cancelAnimationFrame(rafId);
            window.removeEventListener('resize', resizeBalloonCanvas);
            wrap.style.transition='opacity 0.9s ease';
            wrap.style.opacity='0';
            setTimeout(()=>{ wrap.remove(); onDone(); },950);
          },1200);
        }
      }
    });
  }
  wrap.addEventListener('click',handleTap);
  wrap.addEventListener('touchstart',e=>{e.preventDefault();handleTap(e);},{passive:false});
}

</script>
</body>
</html>
